set: consent
category: intimacy
order: 13
title: A reluctant yes
topic: Wanting, not just agreeing
draft: false

situation: |
  You and Leila have been seeing each other for a few weeks. Tonight, at her place, you ask whether she'd like things to go further.

  She pauses, then says quietly, "I guess so, if you want to."

question: What is the best call?

options:
  - text: Take it as a yes. She said so.
    call: risky
    why: >-
      "I guess so" and "if you want to" are about what you want, not what she wants. Consent is a choice
      someone actively makes, and this sounds more like going along with it.

  - text: '"You don''t sound sure, and that''s completely fine. We can just stay like this." Then follow her lead.'
    call: best
    why: >-
      You noticed the hesitation and made the easy option the one that asks nothing of her. Whatever she says
      next is a real choice, because no is now as easy as yes.

  - text: 'Ask "Are you sure?" and carry on if she nods.'
    call: okay
    why: >-
      Checking is right. But a quick "are you sure?" can feel like a request to confirm, and a nod can be
      the same reluctant yes again. Offering a clear alternative works better.

  - text: '"We don''t have to. I just thought you liked me."'
    call: risky
    why: >-
      That turns her hesitation into a test of her feelings for you. Guilt is pressure, and a yes given to
      repair your mood is not a free one.

principle: >-
  Look for a yes someone wants to give, not one they give to please you. "I guess so" is not the same as
  wanting to.
