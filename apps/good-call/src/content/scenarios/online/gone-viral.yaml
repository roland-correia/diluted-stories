set: online
category: feeds
order: 5
title: "Gone viral"
topic: "Online abuse"
draft: false
chat:
  app: dm
  with: "Message requests"
  status: "From people you don't follow"
  messages:
    - from: "system"
      text: "14 new message requests"
    - from: "them"
      text: "nobody asked for your opinion"
    - from: "them"
      text: "delete your account"
situation: "Your post went viral overnight, and strangers are sending you abuse."
question: "What is the best call?"
options:
  - text: "Reply to every one to set the record straight."
    call: risky
    why: "It keeps you reading abuse, and replies often bring more. You don't owe strangers an answer."
  - text: "Block, mute words, report the worst messages, screenshot anything threatening, and lean on people who know you."
    call: best
    why: "You don't have to read it or answer it. Reports and evidence help if you need the platform or the police, and people who know you will remind you who you are."
  - text: "Delete everything, and quit social media for good."
    call: okay
    why: "Taking a break is healthy, but quitting forever can feel like losing. Making your accounts private while it calms down also works."
principle: "You don't have to read it or answer it. Block, report, keep the evidence, and lean on people who know you."
