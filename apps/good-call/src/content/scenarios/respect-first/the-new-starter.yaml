set: respect-first
category: consent
order: 5
title: The new starter
topic: Power and freedom
draft: false

situation: |
  You're a shift supervisor in a shop. Jess, who is 18 and new on your team, is friendly, and you find yourself attracted to her. You decide her shifts.

question: What is the best call?

options:
  - text: Ask her out once, and tell her it won't affect her work.
    call: okay
    why: >-
      Asking once is better than hinting, but a promise doesn't remove the power gap. She may still feel
      that saying no could cost her shifts.

  - text: Give her the better shifts first, then ask her out.
    call: risky
    why: >-
      That ties her job to how she answers. Favours from someone with power over her make a free no almost
      impossible.

  - text: Keep things professional while you manage her. If that ever changes, it's a different situation.
    call: best
    why: >-
      While you control her hours she can't freely say no to you, however kind you are. Keeping it
      professional protects her choice and her job.

  - text: Drop hints with comments about how she looks.
    call: risky
    why: >-
      Comments about a colleague's looks from her boss can be harassment, and leave her feeling unsafe at
      work.

principle: >-
  Freedom is part of consent. A power gap, such as a boss, someone much older, or money, can stop someone
  choosing freely.
