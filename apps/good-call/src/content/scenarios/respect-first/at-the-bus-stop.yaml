set: respect-first
category: people
order: 5
title: At the bus stop
topic: Taking the hint
draft: false

situation: |
  It's late and you're waiting at a bus stop with a woman who is on her own. You say hi and ask where she's heading. She answers in a word, puts her earphones in and moves to the far end of the shelter.

question: What is the best call?

options:
  - text: Move closer and keep chatting. You're only being friendly.
    call: risky
    why: >-
      Earphones in and a step away are a clear "no thanks". Following her when she's alone at night will feel
      threatening, however friendly you mean to be.

  - text: Stay where you are, but keep glancing over to check she's OK.
    call: okay
    why: >-
      A kind instinct. But being watched can feel uncomfortable too, so looking at your own phone is kinder.

  - text: Leave her be, and give her space at your end of the shelter.
    call: best
    why: >-
      She has answered without words. Respecting it, and keeping your distance, helps her feel safe until the
      bus comes.

principle: >-
  Not taking the hint when someone moves away crosses the line. Earphones in and a step back mean no thanks.
