name: Build and deploy

# Every pull request builds the site (so a broken story or a type error shows
# up before merging). Only a push to main also deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Each folder in apps/ is its own Astro project (our products under
      # development). Each is built the same way and served from
      # dilutedstories.com/projects/<its name>/.
      - name: Install, type-check and build each app
        run: |
          for app in good-call 5-minute-mandarin; do
            echo "::group::$app"
            npm --prefix "apps/$app" ci
            npm --prefix "apps/$app" run check
            npm --prefix "apps/$app" run build
            mkdir -p "dist/projects/$app"
            cp -R "apps/$app/dist/." "dist/projects/$app/"
            echo "::endgroup::"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
